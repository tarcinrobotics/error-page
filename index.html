<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>System Status | Maintenance in Progress</title>

  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.0/lottie.min.js"></script>

  <style>
    :root {
      --primary: #0f172a;
      --secondary: #475569;
      --accent: #2563eb;
      --success: #16a34a;
      --danger: #dc2626;
      --white: #ffffff;
    }

    body {
      margin: 0;
      height: 100vh;
      font-family: 'Inter', sans-serif;
      color: var(--primary);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      background: linear-gradient(135deg, #e0e7ff, #f8fafc, #e0f2fe);
      background-size: 200% 200%;
      animation: gradientShift 10s ease infinite;
      overflow-x: hidden;
      padding: 20px;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .overlay {
      padding: 50px 60px;
      max-width: 700px;
      width: 100%;
      animation: fadeIn 1s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .error-code {
      background: var(--accent);
      color: var(--white);
      padding: 8px 20px;
      border-radius: 25px;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 20px;
      text-transform: uppercase;
      display: inline-block;
    }

    h1 {
      font-family: 'Poppins', sans-serif;
      font-size: 38px;
      font-weight: 700;
      margin-bottom: 20px;
      color: var(--primary);
    }

    h1 i {
      color: var(--accent);
      margin-left: 8px;
    }

    #lottie-container {
      width: 260px;
      height: 260px;
      margin: 20px auto 30px;
    }

    p {
      color: var(--secondary);
      font-size: 17px;
      line-height: 1.6;
      margin-bottom: 40px;
    }

    .action-container {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 20px;
    }

    button {
      background-color: var(--accent);
      color: var(--white);
      border: none;
      padding: 12px 28px;
      border-radius: 30px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 5px 15px rgba(37, 99, 235, 0.3);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    button:hover {
      background-color: #1d4ed8;
      transform: translateY(-2px);
    }

    .secondary-btn {
      background-color: transparent;
      color: var(--primary);
      border: 2px solid var(--primary);
      box-shadow: none;
    }

    .secondary-btn:hover {
      background-color: rgba(255, 255, 255, 0.3);
      border-color: var(--accent);
      color: var(--accent);
    }

    .status-indicator {
      font-weight: 600;
      color: var(--secondary);
      margin-top: 15px;
    }

    .status-indicator i {
      margin-right: 6px;
    }

    footer {
      position: absolute;
      bottom: 1px;
      font-size: 14px;
      color: var(--secondary);
      opacity: 0.8;
      text-align: center;
      width: 100%;
    }

    /* ========== Responsive Styles ========== */

    /* Tablets (<= 992px) */
    @media (max-width: 992px) {
      .overlay {
        padding: 40px 40px;
      }

      h1 {
        font-size: 32px;
      }

      #lottie-container {
        width: 220px;
        height: 220px;
      }

      p {
        font-size: 16px;
      }

      button {
        font-size: 15px;
        padding: 10px 24px;
      }
    }

    /* Mobile devices (<= 600px) */
    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      .overlay {
        padding: 30px 20px;
      }

      h1 {
        font-size: 26px;
        margin-bottom: 15px;
      }

      .error-code {
        font-size: 12px;
        padding: 6px 14px;
      }

      #lottie-container {
        width: 180px;
        height: 180px;
        margin: 15px auto 25px;
      }

      p {
        font-size: 15px;
        margin-bottom: 30px;
      }

      .action-container {
        flex-direction: column;
        gap: 10px;
      }

      button {
        width: 100%;
        justify-content: center;
        font-size: 15px;
        padding: 10px 20px;
      }

      footer {
        font-size: 12px;
        bottom: 10px;
        position: relative;
        margin-top: 30px;
      }
    }

    /* Small phones (<= 400px) */
    @media (max-width: 400px) {
      h1 {
        font-size: 22px;
      }

      p {
        font-size: 14px;
      }

      #lottie-container {
        width: 150px;
        height: 150px;
      }

      button {
        font-size: 14px;
        padding: 9px 18px;
      }
    }
  </style>
</head>

<body>
  <div class="overlay">
    <div class="error-code">Checking server status...</div>

    <h1>System Maintenance In Progress <i class="fa-solid fa-screwdriver-wrench"></i></h1>

    <div id="lottie-container"></div>

    <p>
      Our systems are currently undergoing scheduled maintenance or experiencing temporary downtime.<br>
      We’re working hard to get things back online as soon as possible.
    </p>

    <div class="action-container">
      <button onclick="window.chrome?.webview?.postMessage('retry')">
        <i class="fa-solid fa-rotate-right"></i> Retry
      </button>
      <button class="secondary-btn" onclick="window.location.reload()">
        <i class="fa-solid fa-arrows-rotate"></i> Refresh
      </button>
    </div>

    <div class="status-indicator" id="server-status">
      <i class="fa-solid fa-circle-notch fa-spin"></i> Checking server health...
    </div>
  </div>

  <footer>© 2025 Tarcin. All rights reserved.</footer>

  <script>
    lottie.loadAnimation({
      container: document.getElementById('lottie-container'),
      renderer: 'svg',
      loop: true,
      autoplay: true,
      path: 'https://raw.githubusercontent.com/tarcinrobotics/assets/refs/heads/main/error-lottie.json'
    });

    fetch('https://charge19.tarcin.in/status')
      .then(async (response) => {
        const data = await response.json();
        const code = response.status;
        const message = data.message || 'Server response received';

        document.querySelector('.error-code').textContent = `STATUS CODE ${code}`;
        const indicator = document.getElementById('server-status');
        indicator.innerHTML = `<i class='fa-solid fa-circle-check' style='color: var(--success);'></i> ${message}`;
      })
      .catch(() => {
        document.querySelector('.error-code').textContent = 'STATUS CODE 503';
        const indicator = document.getElementById('server-status');
        indicator.innerHTML = `<i class='fa-solid fa-triangle-exclamation' style='color: var(--danger);'></i> Server unreachable (charge19.tarcin.in)`;
      });
  </script>
</body>
</html>
